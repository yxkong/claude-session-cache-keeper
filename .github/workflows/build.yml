name: Build and release CacheKeeper
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a complete GitHub Release
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-2022
            platform: win
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rustTargets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.21.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:rust
      - run: npm run package -- --target=${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: npm run verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CacheKeeper-${{ matrix.platform }}
          path: |
            release/native/CacheKeeper-*
            release/native/build-*.json
            release/native/verification-*.json
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.21.0'
          cache: npm
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: CacheKeeper-*
          merge-multiple: true
          path: release/native
      - run: npm ci --ignore-scripts
      - run: npm run release:metadata -- --directory=release/native
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CacheKeeper-release
          path: release/native/*
      - name: Publish complete release
        if: github.event_name == 'push' || inputs.publish == true
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
