appId: io.yxkong.cachekeeper
productName: CacheKeeper
electronVersion: 45.2.1
directories:
  app: build/app
  output: release/native
files:
  - dist/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: build/resources/marketplace
    to: marketplace
  - from: build/resources/icons
    to: icons
  - from: build/resources/update-config.json
    to: update-config.json
artifactName: CacheKeeper-${version}-${os}-${arch}.${ext}
mac:
  icon: assets/icons/app.icns
  category: public.app-category.utilities
  identity: '-'
  hardenedRuntime: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
win:
  icon: assets/icons/app.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
linux:
  icon: assets/icons
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
